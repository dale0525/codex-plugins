name: Sync external skills and plugins

on:
  schedule:
    - cron: "23 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-external-content
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out marketplace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          cache: true
          frozen: true

      - name: Synchronize configured sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pixi run sync

      - name: Validate synchronized repository
        run: pixi run check

      - name: Detect changes
        id: changes
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit synchronized changes
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "Logic Tan"
          git config user.email "logictan89@gmail.com"
          git add --all
          git commit -m "Sync external skills and plugins"

      - name: Rebase and revalidate against the default branch
        if: steps.changes.outputs.changed == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          git pull --rebase origin "$DEFAULT_BRANCH"

          # The rebase can introduce changes made while synchronization ran.
          # Validate the exact tree that will be pushed, not the pre-rebase tree.
          pixi run check

      - name: Push synchronized changes to the default branch
        if: steps.changes.outputs.changed == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
