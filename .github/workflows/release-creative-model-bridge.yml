name: Release Creative Model Bridge

on:
  push:
    tags:
      - "creative-model-bridge-v*"

permissions:
  contents: write

concurrency:
  group: creative-model-bridge-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build_name: creative-model-bridge-x86_64-unknown-linux-gnu
            asset: creative-model-bridge-x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            build_name: creative-model-bridge-aarch64-unknown-linux-gnu
            asset: creative-model-bridge-aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
            build_name: creative-model-bridge-x86_64-apple-darwin
            asset: creative-model-bridge-x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
            build_name: creative-model-bridge-aarch64-apple-darwin
            asset: creative-model-bridge-aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            build_name: creative-model-bridge-x86_64-pc-windows-msvc
            asset: creative-model-bridge-x86_64-pc-windows-msvc.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          cache: true
          frozen: true
      - name: Validate release version and build contract
        run: python scripts/validate_creative_model_bridge_release.py "${{ github.ref_name }}"
      - name: Build locked one-file executable
        shell: bash
        run: |
          set -euo pipefail
          pixi run --manifest-path plugins/creative-model-bridge/pixi.toml --locked \
            python plugins/creative-model-bridge/scripts/build.py \
            --output-dir "$GITHUB_WORKSPACE/dist" \
            --asset-name "${{ matrix.build_name }}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            source="$GITHUB_WORKSPACE/dist/${{ matrix.build_name }}.exe"
          else
            source="$GITHUB_WORKSPACE/dist/${{ matrix.build_name }}"
          fi
          destination="$GITHUB_WORKSPACE/dist/${{ matrix.asset }}"
          if [[ "$source" != "$destination" ]]; then mv "$source" "$destination"; fi
          chmod 0755 "$GITHUB_WORKSPACE/dist/${{ matrix.asset }}"
      - name: Smoke-test direct MCP binary and provisioning lifecycle
        shell: bash
        run: python scripts/smoke_creative_model_bridge.py "dist/${{ matrix.asset }}"
      - name: Run POSIX bootstrap runtime tests
        if: runner.os != 'Windows'
        shell: bash
        run: pixi run --manifest-path plugins/creative-model-bridge/pixi.toml --locked python -m unittest discover -s plugins/creative-model-bridge/tests -p 'test_bootstrap_runtime.py' -v
      - name: Upload release asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository for release state planner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Pixi for release validation
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          cache: true
          frozen: true
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Generate and validate local six-asset set
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            creative-model-bridge-aarch64-apple-darwin
            creative-model-bridge-x86_64-apple-darwin
            creative-model-bridge-x86_64-unknown-linux-gnu
            creative-model-bridge-aarch64-unknown-linux-gnu
            creative-model-bridge-x86_64-pc-windows-msvc.exe
          )
          for asset in "${expected[@]}"; do test -s "dist/$asset"; done
          (cd dist && sha256sum "${expected[@]}" > checksums.txt && sha256sum -c checksums.txt)
          test "$(find dist -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" = "$(printf '%s\n' "${expected[@]}" checksums.txt | sort | tr '\n' ' ')"
      - name: Plan release state without mutation
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${{ github.ref_name }}" --repo "${GITHUB_REPOSITORY}" --json isDraft,assets > release-state.json 2>/dev/null; then :; else printf '{"status":"absent","assets":[]}' > release-state.json; fi
          plan=$(pixi run python scripts/reconcile_creative_model_bridge_release.py --state-file release-state.json --checksums dist/checksums.txt)
          echo "$plan"
          echo "action=$(python -c 'import json,sys; print(json.loads(sys.argv[1])["action"])' "$plan")" >> "$GITHUB_OUTPUT"
      - name: Create absent release as draft
        if: steps.plan.outputs.action == 'create-draft'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then echo "release appeared after absent plan; retry" >&2; exit 1; fi
          gh release create "${{ github.ref_name }}" dist/* --repo "${GITHUB_REPOSITORY}" --verify-tag --draft --title "Creative Model Bridge ${GITHUB_REF_NAME#creative-model-bridge-v}" --generate-notes
      - name: Complete existing draft release
        if: steps.plan.outputs.action == 'complete-draft'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$(gh release view "${{ github.ref_name }}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq '.isDraft')" = true
          gh release upload "${{ github.ref_name }}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
      - name: Verify remote draft or published release exactly
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          verify_remote() {
            rm -rf remote-release
            mkdir remote-release
            gh release download "${{ github.ref_name }}" --repo "${GITHUB_REPOSITORY}" --dir remote-release
            expected=(creative-model-bridge-aarch64-apple-darwin creative-model-bridge-x86_64-apple-darwin creative-model-bridge-x86_64-unknown-linux-gnu creative-model-bridge-aarch64-unknown-linux-gnu creative-model-bridge-x86_64-pc-windows-msvc.exe)
            test "$(find remote-release -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" = "$(printf '%s\n' "${expected[@]}" checksums.txt | sort | tr '\n' ' ')"
            cmp -s dist/checksums.txt remote-release/checksums.txt
            (cd remote-release && sha256sum -c checksums.txt)
          }
          if ! verify_remote; then
            status=$(gh release view "${{ github.ref_name }}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq '.isDraft')
            if [ "$status" != true ]; then echo "published release mismatch; refusing mutation" >&2; exit 1; fi
            gh release upload "${{ github.ref_name }}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
            verify_remote
          fi
      - name: Publish verified draft, or confirm published exact no-op
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          verify_remote() {
            rm -rf remote-release
            mkdir remote-release
            gh release download "${{ github.ref_name }}" --repo "${GITHUB_REPOSITORY}" --dir remote-release
            expected=(creative-model-bridge-aarch64-apple-darwin creative-model-bridge-x86_64-apple-darwin creative-model-bridge-x86_64-unknown-linux-gnu creative-model-bridge-aarch64-unknown-linux-gnu creative-model-bridge-x86_64-pc-windows-msvc.exe)
            test "$(find remote-release -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" = "$(printf '%s\n' "${expected[@]}" checksums.txt | sort | tr '\n' ' ')"
            cmp -s dist/checksums.txt remote-release/checksums.txt
            (cd remote-release && sha256sum -c checksums.txt)
          }
          status=$(gh release view "${{ github.ref_name }}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq '.isDraft')
          if [ "$status" = true ]; then
            verify_remote
            gh release edit "${{ github.ref_name }}" --repo "${GITHUB_REPOSITORY}" --draft=false
          elif [ "$status" = false ]; then
            verify_remote
            echo "published exact release verified; no mutation"
          else
            echo "unexpected release state" >&2
            exit 1
          fi
