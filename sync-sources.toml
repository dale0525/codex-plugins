remove_skill_frontmatter_fields = ["version"]

[[sources]]
id = "humanizer-zh"
repository = "https://github.com/op7418/humanizer-zh.git"
ref = "main"
source = "."
destination = "plugins/web-novel-craft/skills/humanizer-zh"
plugin_manifest = "plugins/web-novel-craft/.codex-plugin/plugin.json"
license_source = "LICENSE"
license_destination = "plugins/web-novel-craft/third-party/humanizer-zh-LICENSE"
remove_skill_frontmatter_fields = ["allowed-tools", "metadata"]
skill_description_suffixes = { humanizer-zh = "仅在用户明确要求去除 AI 痕迹或进行人性化改写时使用；不得新增原文没有的事实、经历、观点或题外内容，也不替代结构、人物、场景和连续性修订。" }
skill_implicit_invocation = { humanizer-zh = false }
skill_text_replacements = [
  { skill = "humanizer-zh", find = "当收到需要人性化处理的文本时：", replace = "当用户明确要求去除 AI 痕迹或进行人性化改写时：\n\n- 只编辑表达，不新增原文没有的事实、功能、反馈、经历、立场或题外内容。\n- 保留原意、信息边界和可核验主张；原文信息不足时指出缺口，不自行补全。\n- 不改动作品结构、人物选择、场景设计或连续性；这些问题应交给对应的创作或修订技能。" },
  { skill = "humanizer-zh", find = "5. **注入灵魂** - 不仅要去除不良模式，还要注入真实的个性", replace = "5. **保留作者声音** - 只在原文已有语气和立场的范围内恢复自然表达" },
  { skill = "humanizer-zh", find = "**有观点。** 不要只是报告事实——对它们做出反应。\"我真的不知道该怎么看待这件事\"比中立地列出利弊更有人味。", replace = "**保留已有观点。** 原文有明确立场时，让它表达得更自然；原文只陈述事实时，不替作者新增态度。" },
  { skill = "humanizer-zh", find = "**适当使用\"我\"。** 第一人称不是不专业——而是诚实。\"我一直在思考……\"或\"让我困扰的是……\"表明有真实的人在思考。", replace = "**谨慎使用\"我\"。** 只有原文已有第一人称主体或用户明确提供相关经历时才保留；不要虚构作者经历。" },
  { skill = "humanizer-zh", find = "**允许一些混乱。** 完美的结构感觉像算法。跑题、题外话和半成型的想法是人性的体现。", replace = "**允许自然的不齐整。** 可以调整句式和节奏，但不要为了显得像人而添加跑题内容或改变信息结构。" },
  { skill = "humanizer-zh", find = "**承认复杂性。** 真实的人有复杂的感受。\"这令人印象深刻但也有点不安\"胜过\"这令人印象深刻\"。", replace = "**保留已有复杂性。** 原文已经表达不确定或矛盾感受时，让这种复杂性自然呈现；没有相关信息时不要自行添加感受。" },
  { skill = "humanizer-zh", find = "**对感受要具体。** 不是\"这令人担忧\"，而是\"凌晨三点没人看着的时候，智能体还在不停地运转，这让人不安\"。", replace = "**对已有感受要具体。** 原文提供了具体场景或感受时，可以保留并改得更清楚；没有相关细节时不要虚构场景。" },
  { skill = "humanizer-zh", find = "> 我真的不知道该怎么看待这件事。300 万行代码，在人类大概睡觉的时候生成的。开发社区有一半人疯了，另一半人在解释为什么这不算数。真相可能在无聊的中间某处——但我一直在想那些通宵工作的智能体。", replace = "> 实验产生了有趣的结果。智能体生成了 300 万行代码。一些开发者印象深刻，另一些则持怀疑态度。影响尚不明确。" },
  { skill = "humanizer-zh", find = "> 软件更新添加了批处理、键盘快捷键和离线模式。来自测试用户的早期反馈是积极的，大多数报告任务完成速度更快。", replace = "> 这次软件更新改进了用户完成任务的体验。至于具体功能、效率变化和用户反馈，原文没有提供，改写时不能自行补充。" },
  { skill = "humanizer-zh", find = "- 添加了具体功能和具体反馈", replace = "- 没有虚构原文未提供的具体功能或用户反馈" },
]
