version = 1

[[sources]]
id = "emilkowalski-skills"
repository = "https://github.com/emilkowalski/skills.git"
ref = "main"
source = "skills"
destination = "plugins/apple-design/skills"
plugin_manifest = "plugins/apple-design/.codex-plugin/plugin.json"
license_source = "LICENSE"
license_destination = "plugins/apple-design/third-party/emilkowalski-skills-LICENSE"
remove_skill_frontmatter_fields = ["disable-model-invocation"]
skill_description_suffixes = { animate = "Do not use for React Native or Expo (use `animate-expo`), animation audits, animation reviews, or naming effects.", apple-design = "Do not trigger for generic UI implementation, generic code review, or ordinary animation work without an Apple-design request.", emil-design-eng = "Use only when the user explicitly mentions Emil Kowalski, animations.dev, or explicitly invokes this skill; do not trigger for generic UI polish, animation implementation, or code review.", find-animation-opportunities = "Use only when the user explicitly asks to find, list, or audit animation opportunities without changing code. Do not trigger for \"make this feel more alive\" implementation requests, existing-motion fixes, or general UX review; use animate, improve-animations, or review-animations as appropriate.", improve-animations = "Use only when the user explicitly asks for a read-only animation or motion audit, roadmap, or improvement plan. Do not trigger for generic UX polish, direct implementation, or a review of one animation diff.", pick-ui-library = "Only runs when explicitly invoked; it does not trigger from a general frontend implementation request.", prototype = "Only runs when explicitly invoked to build and compare UI variants; it does not trigger for ordinary UI implementation or review.", review-animations = "Use only when the user explicitly asks for an animation review; do not trigger on general code review." }
skill_implicit_invocation = { emil-design-eng = false, find-animation-opportunities = false, improve-animations = false, pick-ui-library = false, prototype = false, review-animations = false }
skill_text_replacements = [{ skill = "animate", find = "If the task needs a *component* rather than an animation — a toast, a drawer, a command menu, a dropdown — stop and invoke `pick-ui-library`. Hand-rolling those is how you end up with a `<div>` dropdown and no focus management.", replace = "If the task needs a *component* rather than an animation — a toast, a drawer, a command menu, a dropdown — use an existing accessible primitive or ask the user to explicitly invoke `pick-ui-library`. Do not automatically invoke an explicit-only skill." }]

[[sources]]
id = "prompt-master"
