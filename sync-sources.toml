version = 1

[[sources]]
id = "emilkowalski-skills"
repository = "https://github.com/emilkowalski/skills.git"
ref = "main"
source = "skills"
destination = "plugins/apple-design/skills"
plugin_manifest = "plugins/apple-design/.codex-plugin/plugin.json"
license_source = "LICENSE"
license_destination = "plugins/apple-design/third-party/emilkowalski-skills-LICENSE"
remove_skill_frontmatter_fields = ["disable-model-invocation"]
skill_description_suffixes = { review-animations = "Use only when the user explicitly asks for an animation review; do not trigger on general code review." }

[[sources]]
id = "prompt-master"
repository = "https://github.com/nidhinjs/prompt-master.git"
ref = "main"
source = "."
destination = "plugins/prompt-master/skills/prompt-master"
plugin_manifest = "plugins/prompt-master/.codex-plugin/plugin.json"
license_source = "LICENSE"
license_destination = "plugins/prompt-master/third-party/prompt-master-LICENSE"
remove_skill_frontmatter_fields = ["version"]

[[github_releases]]
id = "gortex"
repository = "zzet/gortex"
metadata_destination = "plugins/gortex/runtime-release.json"
plugin_manifest = "plugins/gortex/.codex-plugin/plugin.json"
required_assets = [
  "gortex_darwin_arm64.tar.gz",
  "gortex_windows_amd64.zip",
]
checksum_asset = "checksums.txt"
