[workspace]
name = "creative-model-bridge"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.11,<3.14"
pyinstaller = ">=6.0,<7"

[tasks]
run = "PYTHONDONTWRITEBYTECODE=1 python -B -u mcp/cli.py run"
build = "python scripts/build.py"
migrate = "python -B mcp/cli.py migrate"
