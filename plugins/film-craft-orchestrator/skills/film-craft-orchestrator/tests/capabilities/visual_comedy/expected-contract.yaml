id: visual_comedy
runtime_sec: 30
common_gate: validate_ai_video_package
required_artifacts: canonical_13_files
deterministic_checks:
  - setup, escalation, reveal and reaction beats are all covered
  - umbrella position, wetness and character direction remain continuous
  - every clip has canonical downstream records
  - edit contribution totals 30 seconds
creative_checks:
  - the physical rule is readable without dialogue, subtitles or narration
  - repetitions escalate through distinct consequences
  - the final reaction pays off an earlier setup
  - Foley and silence support rather than explain the gag
research_trigger: only_if_canonical_retest_cannot_repair_visual_timing_or_prop_continuity
