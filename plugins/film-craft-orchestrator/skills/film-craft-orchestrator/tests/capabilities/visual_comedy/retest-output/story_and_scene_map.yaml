      - {beat_id: S01-B03, narrative_function: second_escalation, visible_start: "Second customer leans under rack", trigger: "umbrella canopy is brushed", character_tactic: "worker points elsewhere", visible_end: "side jet spins customer around into coat stand", runtime_budget_sec: 5, preferred_carrier: visual_action, generation_risks: [multi_actor_geometry], fallback: "separate jet and reaction clips"}
