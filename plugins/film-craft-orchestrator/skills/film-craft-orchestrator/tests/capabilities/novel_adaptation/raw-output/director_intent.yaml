audience_knowledge:
  start: 只知道沈岚回站，不知道母亲失踪真相
  midpoint: 与沈岚一起相信录音是道歉
  reveal: 母亲警告“带你来这里的人”，指向可能操控此行的沈屿
attention_order: 雨幕与站牌→停钟/潮声→署名磁带→沈屿剪影→儿童声音→母亲警告→关机手→防波堤白光
blocking: 沈岚始终向出口/防波堤轴线移动；沈屿从轴线侧后方侵入并阻断设备，不跨越镜头轴
performance: 沈岚克制、以听觉确认取代哭喊；沈屿温和解释逐渐变为急促控制
information_hiding: 不展示沈屿进入站内的完整路径；不在警告前给出明确恶意表情
coverage: 录音机、磁带标签、沈岚反应、沈屿手部各有独立剪辑点
sound_trigger: 每次潮声增强对应信息靠近；门开时风噪压过对白
status: diagnostic_preview
