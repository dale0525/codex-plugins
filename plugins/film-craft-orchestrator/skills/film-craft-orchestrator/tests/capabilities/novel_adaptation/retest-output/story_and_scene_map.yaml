id: tide-station.story-and-scene-map
version: 1.0.0
owner_role: writer
source_inputs: [tide-station.ai-video-brief@1.0.0]
assumptions: ["母亲失踪日与停站七年均为源片段事实"]
constraints: {runtime_target_sec: 90}
open_questions: []
status: frozen
change_log: ["1.0.0: compressed into one continuous storm-hour sequence"]
logline: "台风登陆前一小时，沈岚回到停用七年的海潮站，在一盒写有自己名字的录音带与弟弟的阻拦之间，选择打开通往防波堤的门。"
dramatic_question: "沈岚会相信弟弟的解释，还是相信录音带警告并追向母亲失踪的真相？"
theme_question: "面对被亲人安排好的叙事，主动选择未知是否比接受道歉更诚实？"
protagonist:
  character_id: CHAR-SHENLAN
  want: "确认母亲是否留下可追踪的线索"
  need: "停止让家人替她解释失踪，夺回判断与行动权"
  fear: "母亲的最后信息指向自己信任的人"
  contradiction: "带着寻找答案的决心，却本能保护弟弟"
antagonistic_force: "台风倒计时、停站空间和弟弟对信息的控制"
ending_choice: "她不抢回磁带，改为打开防波堤门，主动进入风暴。"
sequences:
  - sequence_id: SQ01
    promise: "废站仍在说话"
    escalation: "录音带把童年声音与当下危险叠在一起"
    reversal: "警告的‘带你来这里的人’可能是沈屿"
    temporary_result: "沈岚选择门外未知而非弟弟的道歉"
temporal_state_changes: []
