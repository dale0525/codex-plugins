status: frozen
change_log: ["1.0.0: initial novel adaptation package"]
format: novel-adaptation
audience: "成人悬疑/超自然短片观众"
genre_tone: "台风前的海岸悬疑，克制写实，潮湿冷蓝与磁带暖棕对照"
rights_status: user-owned
creative_goal: "在90秒内让沈岚从寻找母亲线索转为主动穿过防波堤，完成一次关于带路者身份的信息反转。"
must_beats: [S01-B01, S01-B02, S01-B03, S01-B04, S01-B05, S01-B06, S01-B07]
generation_constraints:
  available_models: []
  dialogue_strategy: separate_audio_then_lipsync
