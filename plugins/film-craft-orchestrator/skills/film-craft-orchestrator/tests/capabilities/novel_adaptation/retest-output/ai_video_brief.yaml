id: tide-station.ai-video-brief
version: 1.0.0
owner_role: ai_video_supervisor
source_inputs: [tide-station.adaptation-matrix@1.0.0]
assumptions: ["90秒为成片目标；无真实参考资产，所有生成先作诊断预览", "对白采用先录音后口型/画外声"]
constraints:
  runtime_target_sec: 90
