    visible_start: 两把钥匙并排
    trigger: 阿岚推过备用钥匙
    character_tactic: 以替代物换原钥匙
    visible_end: 小周放下原钥匙
    runtime_budget_sec: 7
    preferred_carrier: prop_insert
    generation_risks:
    - hand_prop_contact
    fallback: 分切手部before/after
  - beat_id: S01-B06
    narrative_function: 留下双重悬念
    visible_start: 小周离开画面
    trigger: 门禁灯变红
    character_tactic: 双方各自保密
    visible_end: 阿岚删除一条监控记录
    runtime_budget_sec: 7
    preferred_carrier: visual_action
    generation_risks:
    - screen_text
    fallback: 无字屏幕+删除音效
