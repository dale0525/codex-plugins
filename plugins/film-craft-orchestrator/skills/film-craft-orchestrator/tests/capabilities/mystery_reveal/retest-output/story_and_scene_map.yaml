logline: "一名侦探在封闭茶室调查失窃案，观众先看见冷却杯底留下的融水环和被挪动的杯垫；嫌疑人把注意力引向窗边，最终侦探用热水复现水环，揭出嫌疑人曾在案发后移动杯子。"
dramatic_question: "谁在案发后移动了杯子，为什么要伪造窗边的时间线？"
theme_question: "当物证比口供更诚实时，人会选择相信哪一种叙事？"
protagonist:
  character_id: CHAR-DETECTIVE
  want: "在不惊动嫌疑人的情况下锁定移动杯子的人"
  need: "接受微小物证足以推翻看似完整的口供"
  fear: "线索被污染而无法成立"
  contradiction: "冷静记录细节，却习惯先相信最顺滑的解释"
antagonistic_force: "嫌疑人林岚用自洽口供和窗边脚印制造错误时间线"
ending_choice: "侦探不争辩口供，现场加热杯底复现融水环并扣留林岚"
sequences:
  - sequence_id: SQ01
    purpose: "观众先获得物证，侦探后进入并接受误导"
    beats: [S01-B01, S01-B02, S01-B03]
  - sequence_id: SQ02
    purpose: "侦探用可重复实验揭示杯子被移动"
    beats: [S01-B04, S01-B05]
