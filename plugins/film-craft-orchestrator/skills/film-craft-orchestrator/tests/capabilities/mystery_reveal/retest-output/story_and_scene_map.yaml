    objective: "确认失窃文件离开桌面的路径"
    obstacle: "林岚提供看似完整的窗边脚印叙事"
    turn: "热水复现水环，杯垫背面粘着文件纤维"
    exit_state: "林岚被扣留，杯子和杯垫封存"
