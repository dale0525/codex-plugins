misdirection: Hold Mara's phone-call explanation in foreground; her hands stay visible and calm.
blocking: Lin enters screen left and tracks clockwise from cup to window; Mara remains screen right between Lin and latch.
performance: Lin clipped and procedural; Mara answers half a beat too quickly, then stills when latch is touched.
camera_language: Locked wides for geography, restrained slider push for clue inserts, handheld micro-wobble only at reveal.
