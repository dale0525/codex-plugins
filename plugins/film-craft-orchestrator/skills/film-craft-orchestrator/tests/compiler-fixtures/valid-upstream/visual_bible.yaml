    layout: Archive door on left wall and public return slot on right wall.
    anchors: [closed bronze archive door, narrow return slot, dropped badge]
    directions: window light from frame left
    time_weather: clear blue hour
props:
  - prop_id: PROP-KEY
    appearance: palm-sized brass key with a round bow
    dimensions: 7 cm long
    holder_state_machine: floor to courier hand to return slot
