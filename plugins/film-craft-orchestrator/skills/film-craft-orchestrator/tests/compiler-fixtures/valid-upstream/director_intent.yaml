theme_form_answer: The key moves toward the lock and then reverses toward the public return slot.
viewpoint_rule: Stay with the courier; do not reveal the badge portrait before the courier sees it.
performance_rules: [Play intention through hand distance from the lock, not abstract guilt.]
space_and_blocking_rules: [Archive door remains screen left and return slot screen right.]
