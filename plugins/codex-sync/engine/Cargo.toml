[package]
name = "codex-sync-engine"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "Deterministic local engine for the Codex Sync plugin"

[[bin]]
name = "codex-sync"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
fs2 = "0.4"
hex = "0.4"
keyring = { version = "3.6", features = ["apple-native", "vendored", "windows-native", "sync-secret-service"] }
open = "5.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.15"
toml = "0.8"
toml_edit = "0.22"
urlencoding = "2.1"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
