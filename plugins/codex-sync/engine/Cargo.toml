[package]
name = "codex-sync-engine"
version = "0.6.7"
edition = "2021"
license = "MIT"
description = "Deterministic local engine for the Codex Sync plugin"

[[bin]]
name = "codex-sync"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
fs2 = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.15"
toml = "0.8"
toml_edit = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
