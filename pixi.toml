[workspace]
name = "codex-plugins"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = ">=3.11,<3.14"
pyyaml = ">=6.0,<7"
actionlint = ">=1.7,<2"
shellcheck = ">=0.10,<1"
rust = ">=1.85,<2"

[tasks]
sync = "python scripts/sync_external_content.py"
validate = "python scripts/validate_repository.py"
test = "python -m unittest discover -s tests -v"
workflow = "actionlint .github/workflows/*.yml"
codex-sync-build = "cargo build --manifest-path plugins/codex-sync/engine/Cargo.toml"
codex-sync-test = "CC=/usr/bin/cc CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=/usr/bin/cc cargo test --manifest-path plugins/codex-sync/engine/Cargo.toml"
fastctx-test = "cargo test --manifest-path plugins/fastctx/engine/Cargo.toml --locked --no-default-features"
check = { depends-on = ["test", "validate", "workflow", "codex-sync-test", "fastctx-test"] }
